<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to language builder!</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    
    <main>
        <h1 style="margin: auto">Welcome to the language builder!</h1>

        <div id="toggleButtons">
            <button onclick="showUser('phonemes')">Add Phoneme</button>
            <button onclick="showUser('morphemes')">Add Morpheme</button>
            <button onclick="showUser('words')">Add Word</button>
            <button onclick="showUser('languages')">Add Language</button>
            <button onclick="showUser('phonemes', true)">Edit Phoneme</button>
            <button onclick="showUser('morphemes', true)">Edit Morpheme</button>
            <button onclick="showUser('words', true)">Edit Word</button>
            <button onclick="showUser('languages', true)">Edit Language</button>
        </div>

        <div id="editMenu" style="display: none">
            <h1 id="editHeader"></h1> <!-- What are you trying to edit -->
            <select id="editSelector" style="margin: auto">
                <option value=""></option>
            </select>
        </div>

        <section id="toBeFilled" style="display: none">

        </section>

        

    </main>

        <!-- Scripts -->
    <!-- Select2 stuffs -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- My scripts :) -->
     <script src="../js/inject_head.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
